---
- name: Update all packages and reboot if needed
  hosts: all
  become: true
  gather_facts: true
  # One node at a time so k3s/Longhorn keep quorum during rolling reboots.
  serial: "{{ serial_count | default(1) }}"
  roles:
    - role: system-upgrade
      tags: [system, upgrade]
  post_tasks:
    - name: Uptime after update
      ansible.builtin.command:
        cmd: uptime
      register: _uptime
      changed_when: false
      tags: [system, upgrade]

    - name: Show uptime
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ _uptime.stdout }}"
      tags: [system, upgrade]

    - name: Report reboot handling
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'rebooted during this run' if (sysupgrade_needs_reboot | default(false))
             else 'no reboot required' }}
      tags: [system, upgrade]