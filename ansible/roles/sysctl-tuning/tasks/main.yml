---
- name: Disable swap
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false
  when: sysctl_disable_swap

- name: Remove swap entries from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#]*\sswap\s.*)$'
    replace: '# \1'
  when: sysctl_disable_swap

- name: Write sysctl tuning file
  ansible.builtin.copy:
    dest: "{{ sysctl_file }}"
    mode: "0644"
    content: |
      # Kubernetes required sysctl tuning
      # Managed by ansible role sysctl-tuning

      # Swap
      vm.swappiness = {{ sysctl_vm_swappiness }}

      # Memory
      vm.overcommit_memory = {{ sysctl_overcommit_memory }}
      vm.max_map_count = {{ sysctl_vm_max_map_count }}

      # Inotify
      fs.inotify.max_user_watches = {{ sysctl_inotify_max_user_watches }}
      fs.inotify.max_user_instances = {{ sysctl_inotify_max_user_instances }}

      # Networking
      net.core.somaxconn = {{ sysctl_net_core_somaxconn }}
      net.ipv4.tcp_tw_reuse = {{ sysctl_net_ipv4_tcp_tw_reuse }}
      net.ipv4.tcp_fin_timeout = {{ sysctl_net_ipv4_tcp_fin_timeout }}
      {% if sysctl_enable_ipv4_forwarding %}
      net.ipv4.ip_forward = 1
      {% endif %}
      {% if sysctl_enable_ipv6_forwarding %}
      net.ipv6.conf.all.forwarding = 1
      {% endif %}
      {% if sysctl_enable_bridge_nf %}
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      {% endif %}

      # Flannel / VXLAN
      net.ipv4.conf.all.rp_filter = {{ sysctl_net_ipv4_conf_all_rp_filter }}

      # Extra settings
      {% for key, value in sysctl_extra.items() %}
      {{ key }} = {{ value }}
      {% endfor %}

- name: Fix resolv.conf for containerd compatibility
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: ansible_facts.distribution == "Fedora"

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false