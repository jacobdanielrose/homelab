---
common_tools_packages:
  - vim
  - htop
  - iotop
  - lsof
  - tcpdump
  - git
  - curl
  - wget
  - jq
  - unzip
  # netcat: nmap-ncat on Fedora/RHEL, netcat-openbsd on Debian/Ubuntu
  - "{{ 'nmap-ncat' if ansible_facts.os_family == 'RedHat' else 'netcat-openbsd' }}"
  # DNS tools: bind-utils on Fedora/RHEL, dnsutils on Debian/Ubuntu
  - "{{ 'bind-utils' if ansible_facts.os_family == 'RedHat' else 'dnsutils' }}"
  - traceroute
  - mtr
  - rsync

common_tools_extra_packages: []