---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_install_dir }}/k3s"
  register: _k3s_binary

- name: Get installed k3s version
  ansible.builtin.command:
    cmd: "{{ k3s_install_dir }}/k3s --version"
  register: _k3s_installed_version
  changed_when: false
  failed_when: false
  when: _k3s_binary.stat.exists

- name: Download and install k3s
  ansible.builtin.shell:
    cmd: >
      curl -sfL {{ k3s_install_url }} |
      INSTALL_K3S_VERSION="{{ k3s_version }}"
      INSTALL_K3S_BIN_DIR="{{ k3s_install_dir }}"
      sh -s -
  args:
    creates: "{{ k3s_install_dir }}/k3s"
  environment: "{{ k3s_env if k3s_env else {} }}"
  register: _k3s_install
  when: >
    not _k3s_binary.stat.exists or
    k3s_version not in (_k3s_installed_version.stdout | default(''))

- name: Ensure config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    mode: "0600"
  register: _k3s_config

- name: Restart k3s if config changed and already installed
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  when: _k3s_config is changed and _k3s_binary.stat.exists

- name: Ensure k3s service is running and enabled
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Wait for node to be ready
  ansible.builtin.command:
    cmd: "{{ k3s_install_dir }}/k3s kubectl get node --no-headers"
  register: _k3s_node_status
  retries: 30
  delay: 5
  until: _k3s_node_status.stdout is search(" Ready")
  changed_when: false

- name: Get kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: _k3s_kubeconfig

- name: Display kubeconfig for local use
  ansible.builtin.debug:
    msg:
      - "K3s control node ready!"
      - ""
      - "To access from your workstation, save this kubeconfig:"
      - "  mkdir -p ~/.kube && sudo cat /etc/rancher/k3s/k3s.yaml > ~/.kube/config"
      - "Then replace '127.0.0.1' in the kubeconfig with the node's IP."
      - ""
      - "Server token (for agents):"
      - "  sudo cat /var/lib/rancher/k3s/server/node-token"
  when: _k3s_install is changed or _k3s_node_status is changed
