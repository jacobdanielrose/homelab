---
k3s_version: "v1.36.2+k3s1"
k3s_install_url: "https://get.k3s.io"
k3s_install_dir: "/usr/local/bin"
k3s_data_dir: "/var/lib/rancher/k3s"
k3s_config_file: "/etc/rancher/k3s/config.yaml"

k3s_server_args: ""

k3s_tls_san: []
k3s_disable_traefik: true
k3s_disable_servicelb: false
k3s_disable_metrics_server: false
k3s_disable_local_storage: false
k3s_disable_components: []
k3s_etcd_only: false

k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"
k3s_cluster_domain: "cluster.local"

k3s_node_ip: ""
k3s_bind_address: ""
k3s_advertise_address: ""
k3s_flannel_backend: "vxlan"
k3s_vpn_ready: false

k3s_token: ""
k3s_token_file: "/etc/rancher/k3s/server-token"

k3s_containerd_registries: {}
k3s_node_labels: {}
k3s_node_taints: []

k3s_env: {}
