---
- name: Fail if k3s_server_url or k3s_token are not set
  ansible.builtin.fail:
    msg: "k3s_server_url and k3s_token are required for agent nodes."
  when: >
    k3s_server_url | length == 0 or k3s_token | length == 0

- name: Stop and reset k3s-agent if it exists
  ansible.builtin.systemd:
    name: k3s-agent
    state: stopped
    enabled: false
  failed_when: false
  register: _k3s_agent_stop

- name: Remove old agent state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s/agent
    - /etc/systemd/system/k3s-agent.service
  when: _k3s_agent_stop is not failed

- name: Download and install k3s agent
  ansible.builtin.shell:
    cmd: >
      curl -sfL {{ k3s_install_url }} |
      INSTALL_K3S_VERSION="{{ k3s_version }}"
      INSTALL_K3S_BIN_DIR="{{ k3s_install_dir }}"
      K3S_URL="{{ k3s_server_url }}"
      K3S_TOKEN="{{ k3s_token }}"
      sh -s - agent
      {% if k3s_node_ip %} --node-ip {{ k3s_node_ip }}{% endif %}
      {% if k3s_flannel_iface %} --flannel-iface {{ k3s_flannel_iface }}{% endif %}
      {% for key, value in k3s_node_labels.items() %} --node-label {{ key }}={{ value }}{% endfor %}
      {% for taint in k3s_node_taints %} --node-taint {{ taint }}{% endfor %}
  environment: "{{ k3s_env if k3s_env else {} }}"
  register: _k3s_install
  changed_when: '"created" in _k3s_install.stdout or "existing" in _k3s_install.stdout'

- name: Ensure k3s-agent service is running and enabled
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true