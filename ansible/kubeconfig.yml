---
- name: Fetch kubeconfig from control plane
  hosts: k3s_servers
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Read kubeconfig from master
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _kubeconfig_raw

    - name: Decode kubeconfig
      ansible.builtin.set_fact:
        kubeconfig_yaml: "{{ _kubeconfig_raw.content | b64decode }}"

    - name: Write kubeconfig locally
      ansible.builtin.copy:
        content: "{{ kubeconfig_yaml }}"
        dest: "{{ playbook_dir }}/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Get master node IP from inventory
      ansible.builtin.set_fact:
        master_ip: "{{ ansible_host | default(inventory_hostname) }}"

    - name: Replace localhost with master IP in kubeconfig
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: "127\\.0\\.0\\.1"
        replace: "{{ master_ip }}"
      delegate_to: localhost
      become: false

    - name: Show kubectl setup instructions
      ansible.builtin.debug:
        msg:
          - "Kubeconfig written to: {{ playbook_dir }}/kubeconfig"
          - ""
          - "To use it:"
          - "  export KUBECONFIG={{ playbook_dir }}/kubeconfig"
          - "  kubectl get nodes"
          - ""
          - "Or copy to default location:"
          - "  mkdir -p ~/.kube && cp {{ playbook_dir }}/kubeconfig ~/.kube/config"