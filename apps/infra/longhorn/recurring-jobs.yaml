# Recurring jobs for every Longhorn volume.
#
# Volumes belong to the "default" recurring-job group implicitly, so no
# per-volume labels or StorageClass `recurringJobSelector` is needed.
#
# Snapshot and backup are separate jobs at different times: the snapshot is the
# fast rollback point kept on-cluster, the backup is the copy that leaves the
# cluster for the NAS. Both run overnight; snapshots are cheap because they are
# copy-on-write, backups only upload changed blocks.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: snapshot
  groups:
    - default
  # Three days of local rollback points.
  retain: 3
  concurrency: 2
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: backup
  groups:
    - default
  # A week of off-cluster copies. Backups are block-incremental and deduplicated
  # per volume, so seven of them cost roughly one full copy plus deltas.
  retain: 7
  concurrency: 2
  labels: {}
