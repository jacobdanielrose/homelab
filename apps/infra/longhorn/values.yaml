defaultSettings:
  defaultReplicaCount: "2"
  createDefaultDiskLabeledNodes: "true"
  storageReservedPercentageForDefaultDisk: "5"
  systemManagedComponentsNodeSelector: "longhorn.io/storage-node:true"
  defaultDataPath: "/var/lib/longhorn"
  # Backups land on the Synology NAS (NFSv4.1). The share must be exported with
  # "No mapping" squash — Longhorn mounts it as root.
  # Longhorn creates a backupstore/ subdirectory inside this share itself.
  backupTarget: "nfs://192.168.3.164:/volume1/k8s-backup?nfsOptions=vers=4.1,hard,timeo=600,retrans=2"
  # NFS needs no credentials; empty stops any stale S3/CIFS secret being used.
  backupTargetCredentialSecret: ""

persistence:
  defaultClassReplicaCount: 2

# Disable pre-upgrade checker job for ArgoCD compatibility
preUpgradeChecker:
  jobEnabled: false

metrics:
  serviceMonitor:
    enabled: true

longhornManager:
  nodeSelector:
    longhorn.io/storage-node: "true"

longhornDriver:
  nodeSelector:
    longhorn.io/storage-node: "true"

longhornUI:
  nodeSelector:
    longhorn.io/storage-node: "true"
