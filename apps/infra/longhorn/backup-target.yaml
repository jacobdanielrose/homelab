# Longhorn backupstore on the Synology NAS (NFSv4.1).
#
# Longhorn creates a "backupstore" directory inside the target and manages it
# itself, so this points at the share root rather than a subdirectory — a
# non-existent NFS subpath would fail to mount.
#
# This is a Setting CR on purpose. The chart's `defaultSettings` in values.yaml
# is only applied at install time; changing it later does not update an existing
# setting.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target
  namespace: longhorn-system
value: "nfs://192.168.3.164:/volume1/k8s-backup?nfsOptions=vers=4.1,hard,timeo=600,retrans=2"
---
# NFS needs no credentials. Explicitly empty so a leftover S3/CIFS credential
# secret from an earlier experiment cannot break the mount.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target-credential-secret
  namespace: longhorn-system
value: ""
