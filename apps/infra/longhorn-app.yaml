apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        valueFiles:
          - $values/apps/infra/longhorn/values.yaml
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      path: apps/infra/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    # Longhorn normalises these server-side and the result can never match the
    # manifest: the nfsOptions query string is percent-encoded, pollInterval is
    # rewritten as a Go duration (5m -> 5m0s), and syncRequestedAt is stamped by
    # the controller on every sync request. Left alone this is a permanent
    # OutOfSync.
    - group: longhorn.io
      kind: BackupTarget
      jsonPointers:
        - /spec/backupTargetURL
        - /spec/pollInterval
        - /spec/syncRequestedAt
