# Uptime Kuma Helm chart values
# https://helmforge.dev/docs/charts/uptime-kuma

image:
  repository: docker.io/louislam/uptime-kuma
  tag: "2.5.6"
  pullPolicy: IfNotPresent

# ── Database (SQLite is fine for single-replica) ──────────────────────────
database:
  type: sqlite

# ── Security context ──────────────────────────────────────────────────────
# Chart 1.6.2 defaults to running as root with ALL capabilities dropped.
# Without CAP_DAC_OVERRIDE, root cannot write the existing data files, which
# are owned by UID 1000 (node) from the previous chart. Run as 1000 instead so
# the container matches the data ownership (and stays non-root).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# ── Persistence ───────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: "longhorn"
  size: 2Gi
  accessModes:
    - ReadWriteOnce

# ── Service ───────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  annotations: {}

# ── Ingress ───────────────────────────────────────────────────────────────
ingress:
  enabled: true
  ingressClassName: traefik
  annotations: {}
  hosts:
    - host: uptime.rostor.lab
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - uptime.rostor.lab
      secretName: uptime-kuma-tls

# ── Probes ────────────────────────────────────────────────────────────────
probes:
  startup:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ── Resources ─────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
