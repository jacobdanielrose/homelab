# Netdata Helm chart values
# https://github.com/netdata/helmchart

# ── Parent (central aggregation node) ──────────────────────────────────────
parent:
  hostname: "netdata-parent"
  enabled: true
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  database:
    persistence: true
    storageclass: "longhorn"
    volumesize: 10Gi

  alarms:
    persistence: true
    storageclass: "longhorn"
    volumesize: 1Gi

  configs:
    netdata:
      enabled: true
      path: /etc/netdata/netdata.conf
      data: |
        [global]
          hostname = {{ .Values.parent.hostname }}
        [db]
          mode = dbengine
          retention = 7d
        [plugins]
          cgroups = no
          tc = no
          enable running new plugins = no
          check for new plugins every = 72000
          python.d = no
          charts.d = no
          go.d = yes
          node.d = no
          apps = no
          proc = no
          idlejitter = no
          diskspace = no
        [web]
          bind to = 0.0.0.0:19999
          bind to = 0.0.0.0:19998
        [ml]
          enabled = no

    stream:
      enabled: true
      path: /etc/netdata/stream.conf
      data: |
        [11111111-2222-3333-4444-555555555555]
          enabled = yes
          history = 3600
          default memory mode = dbengine
          health enabled by default = auto
          allow from = *

    health:
      enabled: true
      path: /etc/netdata/health_alarm_notify.conf
      data: |
        SEND_EMAIL="NO"
        SEND_SLACK="NO"

    exporting:
      enabled: false
      path: /etc/netdata/exporting.conf
      data: ""

  env: {}

# ── Child DaemonSet (per-node collectors) ─────────────────────────────────
child:
  enabled: true
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute

  persistence:
    enabled: true
    hostPath: /var/lib/netdata-k8s-child

  configs:
    netdata:
      enabled: true
      path: /etc/netdata/netdata.conf
      data: |
        [db]
          mode = ram
        [web]
          bind to = localhost:19999
        [health]
          enabled = no
        [ml]
          enabled = no

    stream:
      enabled: true
      path: /etc/netdata/stream.conf
      data: |
        [stream]
          enabled = yes
          destination = netdata:19999
          api key = 11111111-2222-3333-4444-555555555555
          timeout seconds = 60
          buffer size bytes = 1048576
          reconnect delay seconds = 5
          initial clock resync iterations = 60

    exporting:
      enabled: false
      path: /etc/netdata/exporting.conf
      data: ""

    go.d:
      enabled: true
      path: /etc/netdata/go.d.conf
      data: |
        modules:
          pulsar: no
          prometheus: yes

    kubelet:
      enabled: true
      path: /etc/netdata/go.d/k8s_kubelet.conf
      data: |
        update_every: 1
        autodetection_retry: 0
        jobs:
          - name: local
            url: http://127.0.0.1:10255/metrics
          - name: local
            url: https://localhost:10250/metrics
            tls_skip_verify: yes

    kubeproxy:
      enabled: true
      path: /etc/netdata/go.d/k8s_kubeproxy.conf
      data: |
        update_every: 1
        autodetection_retry: 0
        jobs:
          - name: local
            url: http://127.0.0.1:10249/metrics

# ── K8s State collector ───────────────────────────────────────────────────
k8sState:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ── Service / Ingress ─────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 19999

ingress:
  enabled: true
  annotations: null
  path: /
  pathType: Prefix
  spec:
    ingressClassName: traefik
  hosts:
    - netdata.rostor.lab
  tls:
    - secretName: netdata-tls
      hosts:
        - netdata.rostor.lab

# ── OpenTelemetry (disabled for now) ──────────────────────────────────────
otel-collector:
  enabled: false
