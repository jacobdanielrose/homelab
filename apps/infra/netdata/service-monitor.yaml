apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: netdata
  namespace: netdata
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: netdata
      role: parent
  endpoints:
    - port: http
      interval: 15s
      path: /api/v1/metrics?format=prometheus
  namespaceSelector:
    matchNames:
      - netdata
