# RustFS values — S3-compatible object storage for Loki
# Deployed in the loki namespace; replaces the deprecated bundled minio.
fullnameOverride: rustfs
replicaCount: 1
mode:
  standalone:
    enabled: true
    # Recreate, not RollingUpdate: rustfs data/logs are RWO Longhorn volumes. The
    # chart default (maxSurge 0 / maxUnavailable 1) happens to avoid the deadlock,
    # but Recreate states the intent explicitly.
    strategy:
      type: Recreate
  distributed:
    enabled: false
# S3 credentials (also referenced by apps/infra/loki/values.yaml)
secret:
  existingSecret: rustfs-secrets
# Internal only — no ingress, reachable in-cluster at rustfs-svc:9000
ingress:
  enabled: false
storageclass:
  name: longhorn
  dataStorageSize: 30Gi
  logStorageSize: 2Gi
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
