---
# Intel GPU device plugin for the Arc Pro B50 on rostor-worker-node-1.
#
# Two jobs:
#   1. advertise the GPU as an extended resource (gpu.intel.com/xe — the card is
#      bound to the `xe` KMD, not i915, so it is NOT gpu.intel.com/i915);
#   2. hand /dev/dri to pods that request it AND add it to the pod's device
#      cgroup allowlist. A plain hostPath mount of /dev/dri is not enough:
#      open() on renderD129 then fails with EPERM (the pod's device cgroup
#      denies the major:minor), and Vulkan/Level-Zero see zero devices.
#
# The device plugin only runs on the GPU node — everywhere else it would just
# advertise nothing.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rostor-worker-node-1
      initContainers: []
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.37.1
          imagePullPolicy: IfNotPresent
          args:
            # Time-slice the single Arc into 2 slots so two pods can each hold
            # one gpu.intel.com/xe (e.g. ollama + immich-machine-learning).
            - -shared-dev-num=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # No seLinuxOptions on purpose: k3s-agent runs without --selinux, so
            # pods are unconfined and container_device_plugin_t would not apply.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 45Mi
              cpu: 40m
            limits:
              memory: 115Mi
              cpu: 100m
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
