ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.rostor.lab
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  tls:
    - hosts:
        - grafana.rostor.lab
      secretName: grafana-tls

persistence:
  enabled: true
  type: statefulset
  storageClassName: "longhorn"
  accessModes: ["ReadWriteOnce"]
  size: 5Gi

initChownData:
  enabled: false

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  smtp:
    enabled: true
    host: mail.rostor.cloud:587
    user: system@rostor.cloud
    password: $__env{SMTP_PASSWORD}
    from_address: system@rostor.cloud
    from_name: Rostor Alerts
    startTLS_policy: OpportunisticStartTLS
    skip_verify: false

# SMTP credentials for grafana.ini above, injected as an env var and
# referenced via $__env{SMTP_PASSWORD}. Secret is managed by the SealedSecret
# in this directory (apps/infra/grafana/sealed-secrets.yaml).
secretValueFrom:
  - secretKeyRef:
      name: grafana-smtp
      key: password
    target: SMTP_PASSWORD

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.prometheus.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc.cluster.local
        isDefault: false
