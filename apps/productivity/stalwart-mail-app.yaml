apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stalwart-mail
  namespace: argocd
spec:
  project: default
  sources:
    # Chart served from the homelab Forgejo Helm registry.
    # Anonymous read is enabled, so no repo credentials are required.
    - repoURL: https://git.rostor.cloud/api/packages/jacobdanielrose/helm
      chart: stalwart
      targetRevision: 0.1.2
      helm:
        valueFiles:
          - $values/apps/productivity/stalwart-mail/values.yaml
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      ref: values
    # Extra manifests for this app (Certificate, SealedSecret).
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      path: apps/productivity/stalwart-mail
  destination:
    server: https://kubernetes.default.svc
    namespace: stalwart-mail
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
