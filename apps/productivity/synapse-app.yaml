apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synapse
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/element-hq/ess-helm/matrix-stack
      chart: matrix-stack
      targetRevision: 26.8.0
      helm:
        valueFiles:
          - $values/apps/productivity/synapse/values.yaml
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      path: apps/productivity/synapse
  destination:
    server: https://kubernetes.default.svc
    namespace: synapse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true