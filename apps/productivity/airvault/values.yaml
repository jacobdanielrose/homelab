defaultPodOptions:
  # Host networking is required: Wi-Fi discovery is link-local mDNS multicast.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  # Pin to the node where you physically plug in USB devices and that sits on
  # the LAN/Wi-Fi you want to discover. Change the hostname to match your node.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rostor-worker-node-0

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/wizier/airvault
          tag: latest
        env:
          AIRVAULT_PORT: "8080"
          AIRVAULT_LOG_LEVEL: info
          AIRVAULT_MUX_LOG_LEVEL: warn
          TZ: Etc/UTC
        # Auth token injected from the SealedSecret in sealed-secrets.yaml
        envFrom:
          - secretRef:
              name: airvault-secret
        securityContext:
          # USB pairing needs raw access to the USB bus (char major 189).
          privileged: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 20
              periodSeconds: 20
              httpGet:
                path: /
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 20
              periodSeconds: 20
              httpGet:
                path: /
                port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: traefik
    hosts:
      - host: airvault.rostor.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - airvault.rostor.lab
        secretName: airvault-tls

persistence:
  # settings, database, pairing records
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 2Gi
    globalMounts:
      - path: /config
  # the backups themselves — NFS (static PV/PVC in media-pv.yaml)
  backups:
    type: persistentVolumeClaim
    existingClaim: airvault-nfs-pvc
    globalMounts:
      - path: /backups
  # USB bus — required for pairing
  dev-bus-usb:
    type: hostPath
    hostPath: /dev/bus/usb
    globalMounts:
      - path: /dev/bus/usb
  # udev device metadata (read-only)
  run-udev:
    type: hostPath
    hostPath: /run/udev
    globalMounts:
      - path: /run/udev
        readOnly: true
