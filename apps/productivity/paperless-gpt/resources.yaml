apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-gpt-data
  namespace: paperless-gpt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gpt
  namespace: paperless-gpt
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: paperless-gpt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gpt
  namespace: paperless-gpt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-gpt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-gpt
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: paperless-gpt
          image: icereed/paperless-gpt:v0.31.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAPERLESS_BASE_URL
              value: http://paperless-paperless-ngx.paperless.svc:8000
            - name: PAPERLESS_PUBLIC_URL
              value: https://paperless.rostor.cloud
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-gpt-secret
                  key: PAPERLESS_API_TOKEN
            - name: LLM_PROVIDER
              value: ollama
            - name: LLM_MODEL
              value: qwen2.5:14b
            - name: OLLAMA_HOST
              value: http://ollama.ollama.svc:11434
            - name: OCR_PROVIDER
              value: llm
            - name: VISION_LLM_PROVIDER
              value: ollama
            - name: VISION_LLM_MODEL
              value: minicpm-v
            - name: OLLAMA_KEEP_ALIVE
              value: 10m
            - name: LLM_LANGUAGE
              value: German, English or Italian (always write your answer in the same language as the document itself)
            - name: TOKEN_LIMIT
              value: "2000"
            - name: MANUAL_TAG
              value: paperless-gpt
            - name: AUTO_TAG
              value: paperless-gpt-auto
            - name: LISTEN_INTERFACE
              value: ":8080"
          volumeMounts:
            - name: data
              mountPath: /app/prompts
              subPath: prompts
            - name: data
              mountPath: /app/config
              subPath: config
            - name: data
              mountPath: /app/db
              subPath: db
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-gpt-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-gpt
  namespace: paperless-gpt
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-gpt.rostor.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-gpt
                port:
                  name: http
  tls:
    - hosts:
        - paperless-gpt.rostor.lab
      secretName: paperless-gpt-tls
