# Values for the homelab `stalwart` chart (0.1.x, Stalwart v1.0.x).
# Chart source: https://git.rostor.cloud/jacobdanielrose/stalwart
# Schema differs from the previous wrenix chart -- see the notes at the
# bottom of this file.

image:
  repository: ghcr.io/stalwartlabs/stalwart
  tag: "v1.0.1"
  pullPolicy: IfNotPresent

# Single-node deployment: one pod runs every task and listener.
replicaCount: 1
role: ""
pushShard: ""

# Bootstrap administrator credential.
# The chart renders this into a Secret, so the password is stored in git.
# This is only needed for the first login; remove the block once a
# permanent administrator account exists in the database.
recoveryAdmin:
  enabled: false 

# Recovery mode suspends mail services and exposes only the management
# listener. Enable temporarily for offline administration.
recoveryMode:
  enabled: false
  port: 8080
  logLevel: info

extraEnv:
  TZ: Europe/Berlin
  # Public URL Stalwart publishes to clients. Without it the server derives
  # URLs from its own hostname, so OAuth/sign-in redirects point at the pod
  # (https://stalwart-mail-stalwart-0/login?...) instead of the real domain.
  # Must match the URL Traefik serves. See /docs/server/reverse-proxy/traefik.
  STALWART_PUBLIC_URL: https://mail.rostor.cloud

# Sensitive store credentials (S3 keys, DB passwords) belong here.
extraSecretEnv: {}

# Only the DataStore object belongs in config.json. Everything else lives
# in the database after bootstrap.
config:
  "@type": RocksDb
  path: /var/lib/stalwart

# Mail protocols need L4 exposure, so the Service is a LoadBalancer
# (MetalLB homelab-pool 192.168.3.20-192.168.3.30). Traefik only fronts
# the HTTP/HTTPS listeners via the Ingress below.
service:
  type: LoadBalancer
  ports:
    smtp: 25
    smtps: 465
    submission: 587
    imap: 143
    imaps: 993
    pop3: 110
    pop3s: 995
    sieve: 4190
    http: 80
    https: 443
    mgmt: 8080

# Disabled: the chart's Ingress cannot attach a backend ServersTransport,
# and Stalwart's self-signed cert has no IP SANs, so Traefik returns 500.
# HTTP(S) is routed by ingressroute.yaml in this directory instead.
ingress:
  enabled: false

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: longhorn
  size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

podSecurityContext:
  fsGroup: 2000
  runAsUser: 2000
  runAsGroup: 2000

containerSecurityContext: {}

# ---------------------------------------------------------------------------
# Differences from the previous wrenix `stalwart-mail` chart values:
#   * `recovery.enabled`        -> `recoveryAdmin.enabled` + username/password
#   * `secrets.create`          -> not supported (chart always renders its Secret)
#   * `certificate.certmanager` -> handled by certificates.yaml in this dir
#   * probes                    -> chart hardcodes /healthz/{live,ready} on mgmt
#   * image tag v0.16.27        -> v1.0.1 (major upgrade; fresh install, no data)
# The SealedSecret in this directory still carries the old wrenix keys
# (FALLBACK_ADMIN_SECRET, METRICS_*) and is unused by this chart.
# ---------------------------------------------------------------------------
