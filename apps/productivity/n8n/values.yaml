image:
  repository: n8nio/n8n
  tag: "2.35.1"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - host: n8n.rostor.lab
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - n8n.rostor.lab
      secretName: n8n-tls

main:
  config:
    n8n:
      log:
        level: info
    db:
      type: postgresdb
      postgresdb:
        database: n8n
        host: n8n-postgres
        port: 5432
        user: n8n
        schema: public
    generic:
      timezone: Europe/Zurich
    executions:
      process: main
      saveDataOnError: all
      saveDataOnSuccess: all
      saveDataManualExecutions: false
      pruneData: true
      pruneDataMaxAge: 168

  extraEnv:
    - name: DB_POSTGRESDB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: n8n-postgres-secret
          key: password
    - name: N8N_ENABLED_MODULES
      value: "instance-ai,agents"
    - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
      value: "true"
    - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
      value: "daytona"
    - name: DAYTONA_API_URL
      value: "https://app.daytona.io/api"
    - name: DAYTONA_API_KEY
      valueFrom:
        secretKeyRef:
          name: n8n-daytona-secret
          key: DAYTONA_API_KEY
    - name: N8N_INSTANCE_AI_MODEL
      value: "ollama/llama3.1:8b"
    - name: N8N_INSTANCE_AI_MODEL_API_KEY
      valueFrom:
        secretKeyRef:
          name: n8n-ollama-secret
          key: OLLAMA_API_KEY
    - name: N8N_INSTANCE_AI_OLLAMA_BASE_URL
      value: "http://ollama.ollama.svc.cluster.local:11434"
    - name: N8N_INSTANCE_AI_SEARXNG_URL
      value: "http://searxng.searxng.svc.cluster.local:8080"

  persistence:
    enabled: true
    type: dynamic
    storageClass: longhorn
    size: 5Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rostor-worker-node-0

valkey:
  enabled: false

worker:
  enabled: false

webhook:
  enabled: false
