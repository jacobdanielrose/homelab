ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - host: n8n.rostor.lab
      paths:
        - /
  tls:
    - hosts:
        - n8n.rostor.lab
      secretName: n8n-tls

main:
  config:
    n8n:
      log:
        level: info
    db:
      type: postgresdb
      postgresdb:
        database: n8n
        host: n8n-postgres
        port: 5432
        user: n8n
        schema: public
    generic:
      timezone: Europe/Zurich
    n8n:
      auth:
        oidc:
          enabled: true
          issuer: "https://authentik.rostor.lab/application/o/n8n/"
          scopes: "openid email profile n8n"
          usernameKey: "preferred_username"
          clientId: "ZsH4NsF1b8rzzxnFxSdj0Vn7EYopt9imG88QWD7a"
    executions:
      process: main
      saveDataOnError: all
      saveDataOnSuccess: all
      saveDataManualExecutions: false
      pruneData: true
      pruneDataMaxAge: 168

  extraEnv:
    - name: DB_POSTGRESDB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: n8n-postgres-secret
          key: password
    - name: N8N_AUTH_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: n8n-oidc-secret
          key: oidc-client-secret

  persistence:
    enabled: true
    type: dynamic
    storageClass: longhorn
    size: 5Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - rostor-worker-node-0

valkey:
  enabled: false

worker:
  enabled: false

webhook:
  enabled: false
