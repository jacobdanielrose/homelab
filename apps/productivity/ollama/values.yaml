ingress:
  enabled: true
  ingressClassName: traefik
  hosts: 
  - host: ollama.rostor.cloud
    paths: 
      - path: / 
        pathType: Prefix
  tls:
    - secretName: ollama-cloud-tls
      hosts:
        - ollama.rostor.cloud

ollama:
  models:
    pull:
      - nomic-embed-text:v1.5
      - qwen3-coder:30b
      - qwen2.5-coder:32b
      - qwen2.5:32b
      - llama3.1:8b
      - llama3.1:70b
      - deepseek-r1:32b
      - deepseek-r1:70b

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 200Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rostor-worker-node-0

extraEnv:
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: ollama-api-key
        key: OLLAMA_API_KEY
  - name: OLLAMA_ORIGINS
    value: "https://ai.rostor.cloud,https://finance.rostor.cloud,https://ollama.rostor.cloud,app://.*,chrome-extension://*"
