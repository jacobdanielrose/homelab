ingress:
  enabled: true
  ingressClassName: traefik
  hosts: 
  - host: ollama.rostor.cloud
    paths: 
      - path: / 
        pathType: Prefix
  tls:
    - secretName: ollama-cloud-tls
      hosts:
        - ollama.rostor.cloud

ollama:
  models:
    pull:
      # ── Embedding ──────────────────────────────────────────
      - nomic-embed-text:v1.5        # 274MB — used by sure & karakeep, always fits
      # ── Text (12B — the only model that co-loads cleanly) ──
      - mistral-nemo:12b             # 7.5GB / 7126 MiB VRAM, ~20 tok/s — default for
                                     # sure, n8n, karakeep, paperless; co-loads with
                                     # qwen3-vl:8b (12.3GB combined, both 100% GPU)
      # ── Text (14B, standalone — one at a time) ────────────
      # 9.5-9.7GB / ~9.0 GiB VRAM, ~10-11 tok/s. Fits solo with ~4GB spare:
      # co-loads with a 3.6GB vision model, never with another 14B.
      - qwen3:14b                    # all-rounder: chat, doc analysis, general
      - qwen2.5-coder:14b            # coding specialist (left as-is — do not change)
      - deepseek-r1:14b              # reasoning specialist: math, logic, complex tasks
      # ── Vision ─────────────────────────────────────────────
      - qwen3-vl:8b                  # 5.8GB / 5179 MiB VRAM, ~17 tok/s — vision & OCR
                                     # (karakeep, paperless-gpt); pairs with mistral-nemo
      # Measured on the Arc Pro B50: 16303 MiB reported, ~14.6 GiB free at idle.
      # Ollama stays 100% GPU up to ~12.3 GB of combined footprint (weights + KV
      # + compute) at the default 4096 ctx: nemo + qwen3-vl:8b = 12.3GB (fits)
      # and 14B + qwen3-vl:4b = 12.3GB (fits), but 14B + qwen3-vl:8b = 14.4GB
      # gets evicted instead.
      # Raising num_ctx above 4096 grows the KV cache (+1-2GB per ~12k tokens)
      # and breaks the co-load pairs, so leave ctx at the default for shared apps.

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 200Gi

# Intel Arc Pro B50 (Battlemage G21) lives on rostor-worker-node-1 and is served
# by the intel-gpu device plugin (apps/infra/intel-gpu) as gpu.intel.com/xe.
# Ollama reaches it through Vulkan, not CUDA/ROCm — hence OLLAMA_VULKAN below.
# The chart's ollama.gpu block only understands nvidia/amd, so the resource is
# requested directly in resources.limits instead.
resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    gpu.intel.com/xe: 1
    # Headroom for mmap'd weights if a model does not fit in the 16 GB VRAM.
    memory: 32Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rostor-worker-node-1

extraEnv:
  # Enable the bundled Vulkan backend (Intel Arc). Without this Ollama runs CPU-only.
  - name: OLLAMA_VULKAN
    value: "1"
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: ollama-api-key
        key: OLLAMA_API_KEY
  - name: OLLAMA_ORIGINS
    value: "https://ai.rostor.cloud,https://finance.rostor.cloud,https://ollama.rostor.cloud,app://.*,chrome-extension://*"
