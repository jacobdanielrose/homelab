ingress:
  enabled: true
  ingressClassName: traefik
  hosts: 
  - host: ollama.rostor.cloud
    paths: 
      - path: / 
        pathType: Prefix
  tls:
    - secretName: ollama-cloud-tls
      hosts:
        - ollama.rostor.cloud

ollama:
  models:
    pull:
      # ── Embedding ──────────────────────────────────────────
      - nomic-embed-text:v1.5        # ~1GB — used by sure & karakeep, always fits
      # ── Text (12B, concurrent-safe with vision) ───────────
      # ~8GB — pairs with any vision model (~13GB total, 3GB headroom)
      - mistral-nemo:12b             # default for sure, n8n, karakeep, paperless
      # ── Text (14B, standalone — one at a time) ────────────
      # Each ~9GB, fill 16GB solo. Pick the specialist you need.
      - qwen2.5:14b                  # all-rounder: chat, doc analysis, general
      - qwen2.5-coder:14b            # coding specialist (distinct from above)
      - deepseek-r1:14b              # reasoning specialist: math, logic, complex tasks
      # ── Vision ─────────────────────────────────────────────
      - qwen2.5-vl:7b                # ~5.5GB — vision understanding & OCR (karakeep, paperless-gpt)

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 200Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rostor-worker-node-0

extraEnv:
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: ollama-api-key
        key: OLLAMA_API_KEY
  - name: OLLAMA_ORIGINS
    value: "https://ai.rostor.cloud,https://finance.rostor.cloud,https://ollama.rostor.cloud,app://.*,chrome-extension://*"
