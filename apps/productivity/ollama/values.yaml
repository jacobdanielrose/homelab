ingress:
  enabled: true
  ingressClassName: traefik
  hosts: 
  - host: ollama.rostor.cloud
    paths: 
      - path: / 
        pathType: Prefix
  tls:
    - secretName: ollama-cloud-tls
      hosts:
        - ollama.rostor.cloud

ollama:
  models:
    pull:
      # ── Embedding ──────────────────────────────────────────
      - nomic-embed-text:v1.5        # ~1GB — used by sure & karakeep, always fits
      # ── Text (12B, concurrent-safe with vision) ───────────
      # ~8GB — pairs with any vision model (~13GB total, 3GB headroom)
      - mistral-nemo:12b             # default for sure, n8n, karakeep, paperless
      # ── Text (14B, standalone — one at a time) ────────────
      # Each ~9GB, fill 16GB solo. Pick the specialist you need.
      - qwen3:14b                    # all-rounder: chat, doc analysis, general
      - qwen2.5-coder:14b            # coding specialist (left as-is — do not change)
      - deepseek-r1:14b              # reasoning specialist: math, logic, complex tasks
      # ── Vision ─────────────────────────────────────────────
      - qwen3-vl:8b                  # ~6GB — vision understanding & OCR (karakeep, paperless-gpt)

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 200Gi

# Intel Arc Pro B50 (Battlemage G21) lives on rostor-worker-node-1 and is served
# by the intel-gpu device plugin (apps/infra/intel-gpu) as gpu.intel.com/xe.
# Ollama reaches it through Vulkan, not CUDA/ROCm — hence OLLAMA_VULKAN below.
# The chart's ollama.gpu block only understands nvidia/amd, so the resource is
# requested directly in resources.limits instead.
resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    gpu.intel.com/xe: 1
    # Headroom for mmap'd weights if a model does not fit in the 16 GB VRAM.
    memory: 32Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - rostor-worker-node-1

extraEnv:
  # Enable the bundled Vulkan backend (Intel Arc). Without this Ollama runs CPU-only.
  - name: OLLAMA_VULKAN
    value: "1"
  - name: OLLAMA_API_KEY
    valueFrom:
      secretKeyRef:
        name: ollama-api-key
        key: OLLAMA_API_KEY
  - name: OLLAMA_ORIGINS
    value: "https://ai.rostor.cloud,https://finance.rostor.cloud,https://ollama.rostor.cloud,app://.*,chrome-extension://*"
