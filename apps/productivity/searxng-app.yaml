apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/littleoffice/charts/searxng
      chart: searxng
      targetRevision: 1.2.0
      helm:
        valueFiles:
          - $values/apps/productivity/searxng/values.yaml
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      ref: values
    # Local path source for the SealedSecret that pins the valkey password.
    # Without this, ArgoCD renders the chart with `helm template` (offline),
    # so the chart's `lookup` returns nothing and `randAlphaNum` mints a new
    # valkey password on EVERY sync. Valkey restarts with the new password
    # while already-running SearXNG pods keep the old one, producing
    # intermittent HTTP 500s (one bad replica behind Traefik).
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      path: apps/productivity/searxng
  destination:
    server: https://kubernetes.default.svc
    namespace: searxng
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
