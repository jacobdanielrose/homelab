# Traefik exposure for Bulwark Mail (chart Ingress is disabled in values.yaml).
#
# Same-origin topology: the browser and the Bulwark Pod both use
# https://webmail.rostor.cloud as the JMAP URL. Traefik routes the JMAP and
# authentication paths to the Stalwart HTTPS listener (skipping its
# self-signed certificate via the stalwart-insecure ServersTransport that
# the mail.rostor.cloud IngressRoute already uses), and everything else to
# the Bulwark Service. This avoids the CORS configuration that cross-origin
# webmail would need on Stalwart.
#
# Stalwart's own routes (WebUI, OAuth, IMAP/SMTP listeners) stay on
# mail.rostor.cloud and are untouched.
#
# Note: for cross-namespace backends Traefik resolves ServersTransport in
# the target Service's namespace, hence the reference to the transport that
# already lives next to Stalwart (stalwart-mail/stalwart-insecure).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bulwark-mail
  namespace: bulwark-mail
spec:
  entryPoints:
    - websecure
  routes:
    # Paths Stalwart serves. /api/auth is matched exactly (the /api/auth/*
    # routes below it belong to Bulwark's own API). Bulwark has no bare
    # /auth/ or /jmap/ application routes.
    - kind: Rule
      match: Host(`webmail.rostor.cloud`) && (Path(`/.well-known/jmap`) || PathPrefix(`/jmap/`) || Path(`/api/auth`) || Path(`/api/auth/`) || PathPrefix(`/auth/`))
      priority: 3000
      services:
        - kind: Service
          name: stalwart-mail-stalwart
          namespace: stalwart-mail
          port: 443
          scheme: https
          serversTransport: stalwart-insecure
    # Everything else is the Bulwark application. Explicitly excluding the
    # JMAP/auth prefixes keeps this route from shadowing the one above
    # regardless of Traefik's priority calculation.
    - kind: Rule
      match: Host(`webmail.rostor.cloud`) && !(Path(`/.well-known/jmap`) || PathPrefix(`/jmap/`) || Path(`/api/auth`) || Path(`/api/auth/`) || PathPrefix(`/auth/`))
      services:
        - kind: Service
          name: bulwark-mail
          namespace: bulwark-mail
          port: 3000
  tls:
    secretName: webmail-tls
