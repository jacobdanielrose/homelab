# vaultwarden (guerzon chart) — https://github.com/guerzon/vaultwarden
# Hosted at passwords.rostor.cloud
# NOTE: currently using a Let's Encrypt STAGING certificate for initial setup.
# To switch to prod, change the issuerRef in certificates.yaml to letsencrypt-prod
# and restart the deployment (cert-manager will rotate the secret).

image:
  repository: vaultwarden/server
  tag: "1.37.5-alpine"
  pullPolicy: IfNotPresent

replicas: 1

# Admin token is loaded from a SealedSecret so it never lives in plaintext in Git.
adminToken:
  existingSecret: vaultwarden-admin-token
  existingSecretKey: ADMIN_TOKEN

# The app is only reachable internally behind Traefik at this domain.
# DOMAIN is used by Vaultwarden for building absolute URLs (favicon, sends, etc.)
domain: "https://passwords.rostor.cloud"

# Register secret manager access (auto-login) is a nice convenience but requires
# an admin-created org entry; enable via admin panel. Signups stay open for now.
signupsAllowed: true
signupsVerify: "true"

# Outbound mail via the Rostor Stalwart mail server (system service account).
# Password + username live in the sealed secret vaultwarden-smtp.
smtp:
  existingSecret: vaultwarden-smtp
  host: mail.rostor.cloud
  port: 587
  security: starttls
  from: system@rostor.cloud
  fromName: Vaultwarden
  authMechanism: Plain
  username:
    existingSecretKey: SMTP_USERNAME
  password:
    existingSecretKey: SMTP_PASSWORD

# SSO via Authentik (same IdP as the rest of the homelab).
# Client id/secret live in the sealed secret vaultwarden-sso.
# NOTE: onlySSO stays false so master-password login remains available.
sso:
  enabled: true
  existingSecret: vaultwarden-sso
  clientId:
    existingSecretKey: SSO_CLIENT_ID
  clientSecret:
    existingSecretKey: SSO_CLIENT_SECRET
  # OIDC discovery endpoint, WITHOUT trailing '/.well-known/openid-configuration'
  authority: "https://authentik.rostor.cloud/application/o/vaultwarden/"
  scopes: "email profile"
  signupsMatchEmail: true
  ignoreEmailVerification: false
  onlySSO: false
  enforceSSO: false
  pkce: true

# SQLite database, stored in the data volume created below.
database:
  type: default

storage:
  data:
    name: vaultwarden-data
    size: 10Gi
    class: longhorn
    path: /data
    accessMode: ReadWriteOnce

ingress:
  enabled: true
  class: traefik
  # Disable the nginx-specific annotations bundled with the chart — Traefik
  # ignores unknown annotations, but keep it clean.
  nginxIngressAnnotations: false
  tls: true
  hostname: passwords.rostor.cloud
  path: "/"
  pathType: Prefix
  # TLS certificate is provisioned by cert-manager (see certificates.yaml).
  tlsSecret: vaultwarden-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
