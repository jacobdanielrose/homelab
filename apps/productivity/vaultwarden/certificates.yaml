apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
  namespace: vaultwarden
spec:
  secretName: vaultwarden-tls
  dnsNames:
    - passwords.rostor.cloud
  issuerRef:
    # STAGING while setting up — switch to letsencrypt-prod once validated.
    name: letsencrypt-staging
    kind: ClusterIssuer
