applicationProtocol: https
applicationHost: karakeep.rostor.cloud

controllers:
  karakeep:
    type: statefulset
    containers:
      karakeep:
        image:
          repository: ghcr.io/karakeep-app/karakeep
          tag: 0.33.1
        env:
          NEXTAUTH_URL: "https://karakeep.rostor.cloud"
          DATA_DIR: /data
          LOG_LEVEL: warning
          DB_WAL_MODE: "true"
          DISABLE_SIGNUPS: "false"
          DISABLE_PASSWORD_AUTH: "true"
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
          OAUTH_PROVIDER_NAME: Authentik
          OAUTH_WELLKNOWN_URL: https://authentik.rostor.cloud/application/o/karakeep/.well-known/openid-configuration
          OPENAI_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
          INFERENCE_TEXT_MODEL: llama3.1:8b
          INFERENCE_IMAGE_MODEL: llava:7b
          EMBEDDING_ENABLE_AUTO_INDEXING: "true"
          EMBEDDING_OPENAI_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
          EMBEDDING_TEXT_MODEL: nomic-embed-text
          EMBEDDING_DIMENSIONS: "768"
          INFERENCE_CONTEXT_LENGTH: "4096"
          INFERENCE_OUTPUT_SCHEMA: json
          OAUTH_CLIENT_ID: "<your-oidc-client-id>"
          OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: karakeep-oidc-secret
                key: OAUTH_CLIENT_SECRET
        envFrom:
          - secretRef:
              name: karakeep
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 10
              httpGet:
                path: /api/health
                port: 3000
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 10
              httpGet:
                path: /api/health
                port: 3000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: longhorn
          globalMounts:
            - path: /data

  chrome:
    containers:
      chrome:
        image:
          repository: gcr.io/zenika-hub/alpine-chrome
          tag: 124
        args:
          - --remote-debugging-address=0.0.0.0
          - --remote-debugging-port=9222
          - --headless
          - --hide-scrollbars
          - --disable-gpu
          - --disable-dev-shm-usage
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9222
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 9222
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - SYS_ADMIN
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            memory: 100Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m

service:
  karakeep:
    controller: karakeep
    ports:
      http:
        port: 3000
  chrome:
    controller: chrome
    ports:
      http:
        port: 9222

ingress:
  karakeep:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: karakeep.rostor.cloud
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: karakeep
              port: http
    tls:
      - hosts:
          - karakeep.rostor.cloud
        secretName: karakeep-tls

persistence:
  chrome-tmp:
    type: emptyDir
    advancedMounts:
      chrome:
        chrome:
          - path: /tmp
            readonly: false

meilisearch:
  auth:
    existingMasterKeySecret: karakeep-meilesearch
  environment:
    MEILI_ENV: production
  persistence:
    enabled: true
    size: 2Gi
    storageClass: longhorn
  podAnnotations:
    sidecar.istio.io/inject: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi