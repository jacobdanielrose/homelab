apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ai-data
  namespace: paperless-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ai
  namespace: paperless-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: paperless-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ai
  namespace: paperless-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ai
    spec:
      containers:
        - name: paperless-ai
          image: clusterzx/paperless-ai:4.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PAPERLESS_AI_PORT
              value: "3000"
            - name: RAG_SERVICE_ENABLED
              value: "true"
            - name: RAG_SERVICE_URL
              value: http://localhost:8000
            # Persist the embedding model download across restarts
            - name: HF_HOME
              value: /app/data/hf-cache
            # Paperless connection
            - name: PAPERLESS_API_URL
              value: http://paperless-paperless-ngx.paperless.svc:8000/api
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-ai-secret
                  key: PAPERLESS_API_TOKEN
            - name: PAPERLESS_USERNAME
              value: paperless-ai
            # LLM (Ollama)
            - name: AI_PROVIDER
              value: ollama
            - name: OLLAMA_API_URL
              value: http://ollama.ollama.svc:11434
            - name: OLLAMA_MODEL
              value: qwen3:14b
            # Qwen3 defaults to a slow reasoning mode on CPU; turn it off so
            # classification is quick. Fallback if classification quality is
            # still lacking: qwen3:30b (18.6GB, fits this node, ~2x slower).
            - name: OLLAMA_THINK
              value: "off"
            # paperless-ai handles everything: OCR, title, tags, correspondent,
            # document type, date and custom fields. The built-in Paperless AI is
            # disabled (see apps/productivity/paperless/values.yaml), so these
            # never fight over a field.
            - name: ACTIVATE_TITLE
              value: "true"
            - name: ACTIVATE_TAGGING
              value: "true"
            - name: ACTIVATE_CORRESPONDENTS
              value: "true"
            - name: ACTIVATE_DOCUMENT_TYPE
              value: "true"
            - name: ACTIVATE_CUSTOM_FIELDS
              value: "true"
            - name: ACTIVATE_DOCUMENT_DATE
              value: "true"
            # Only process documents carrying this tag, so it does not compete
            # with paperless-gpt (which uses its own tags).
            - name: PROCESS_PREDEFINED_DOCUMENTS
              value: "yes"
            - name: TAGS
              value: ai-process
            - name: ADD_AI_PROCESSED_TAG
              value: "yes"
            - name: AI_PROCESSED_TAG_NAME
              value: ai-processed
            - name: SCAN_INTERVAL
              value: "*/30 * * * *"
            # OCR (PaddleOCR). Documents are almost exclusively printed, so
            # PaddleOCR is a better fit than paperless-gpt's vision-LLM OCR.
            # 'poor' mode runs OCR only when Paperless has no/garbled text and
            # replaces it only when the OCR reads it better (with undo); a clean
            # digital text layer is never overwritten.
            - name: OCR_ENABLED
              value: "true"
            - name: OCR_MODE
              value: poor
            # latin model covers the household languages (de/en/it/es)
            - name: OCR_LANGUAGE
              value: latin
            - name: OCR_QUALITY
              value: balanced
            - name: OCR_DEVICE
              value: cpu
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ai-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ai
  namespace: paperless-ai
  annotations:
    cert-manager.io/cluster-issuer: rostor-internal
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-ai.rostor.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-ai
                port:
                  name: http
  tls:
    - hosts:
        - paperless-ai.rostor.lab
      secretName: paperless-ai-tls
