apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ai-data
  namespace: paperless-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ai
  namespace: paperless-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: paperless-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ai
  namespace: paperless-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ai
    spec:
      containers:
        - name: paperless-ai
          image: clusterzx/paperless-ai:3.0.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PAPERLESS_AI_PORT
              value: "3000"
            - name: RAG_SERVICE_ENABLED
              value: "true"
            - name: RAG_SERVICE_URL
              value: http://localhost:8000
            # Persist the embedding model download across restarts
            - name: HF_HOME
              value: /app/data/hf-cache
            # Paperless connection
            - name: PAPERLESS_API_URL
              value: http://paperless-paperless-ngx.paperless.svc:8000/api
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-ai-secret
                  key: PAPERLESS_API_TOKEN
            - name: PAPERLESS_USERNAME
              value: paperless-ai
            # LLM (Ollama)
            - name: AI_PROVIDER
              value: ollama
            - name: OLLAMA_API_URL
              value: http://ollama.ollama.svc:11434
            - name: OLLAMA_MODEL
              value: qwen2.5:14b
            # Only process documents carrying this tag, so it does not
            # compete with paperless-gpt (which uses its own tags).
            - name: PROCESS_PREDEFINED_DOCUMENTS
              value: "yes"
            - name: TAGS
              value: ai-process
            - name: ADD_AI_PROCESSED_TAG
              value: "yes"
            - name: AI_PROCESSED_TAG_NAME
              value: ai-processed
            - name: SCAN_INTERVAL
              value: "*/30 * * * *"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ai-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ai
  namespace: paperless-ai
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-ai.rostor.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-ai
                port:
                  name: http
  tls:
    - hosts:
        - paperless-ai.rostor.lab
      secretName: paperless-ai-tls
