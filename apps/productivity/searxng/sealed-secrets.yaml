# Valkey cache credentials and configuration for SearXNG.
#
# The chart mounts `valkey.conf` from the SAME secret it reads the password
# from (`valkey.auth.existingSecret`), and it only generates that secret when
# existingSecret is empty. Because we pin the password here — letting the chart
# generate it makes `lookup` return empty during ArgoCD's offline render, so
# randAlphaNum mints a new password on every sync — this secret has to carry
# the config file too, not just the password.
#
# `valkey.conf` mirrors searxng chart 1.2.0 templates/valkey/secret.yaml.
# Re-check it when bumping the chart version.
#
# Re-sealing:
#   kubectl -n searxng get secret searxng-valkey -o jsonpath='{.data.valkey-password}' | base64 -d
#   (write a plain Secret with valkey-password + valkey.conf, then:)
#   kubeseal --format yaml --controller-name sealed-secrets \
#     --controller-namespace sealed-secrets < plain.yaml > sealed-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: searxng-valkey
  namespace: searxng
spec:
  encryptedData:
    valkey-password: 
    valkey.conf: 
  template:
    metadata:
      name: searxng-valkey
      namespace: searxng
    type: Opaque
