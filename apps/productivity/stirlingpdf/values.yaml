controllers:
  main:
    containers:
      main:
        image:
          repository: docker.io/stirlingtools/stirling-pdf
          tag: latest
        env:
          DISABLE_ADDITIONAL_FEATURES: "false"
          LANGS: en_GB
          SYSTEM_DEFAULTLOCALE: en-GB
          SYSTEM_MAXFILESIZE: "100"
          # --- SSO / Authentik OIDC ---
          DOCKER_ENABLE_SECURITY: "true"
          SECURITY_ENABLELOGIN: "true"
          SECURITY_LOGINMETHOD: all
          SECURITY_OAUTH2_ENABLED: "true"
          SECURITY_OAUTH2_PROVIDER: authentik
          SECURITY_OAUTH2_ISSUER: https://authentik.rostor.cloud/application/o/stirlingpdf/
          SECURITY_OAUTH2_CLIENTID: x09dttUfpDyc0JipDJBTR8CVAwA6bTMFSjNOXnfl
          SECURITY_OAUTH2_SCOPES: "openid, profile, email"
          SECURITY_OAUTH2_USEASUSERNAME: email
          SECURITY_OAUTH2_AUTOCREATEUSER: "true"
          SECURITY_OAUTH2_REDIRECTBASEURL: https://stirlingpdf.rostor.cloud
        envFrom:
          - secretRef:
              name: stirlingpdf-oidc-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 30
              periodSeconds: 20
              httpGet:
                path: /api/v1/info/status
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 30
              periodSeconds: 20
              httpGet:
                path: /api/v1/info/status
                port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: traefik
    hosts:
      - host: stirlingpdf.rostor.cloud
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - stirlingpdf.rostor.cloud
        secretName: stirlingpdf-tls

persistence:
  configs:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 1Gi
    globalMounts:
      - path: /configs
  training-data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 1Gi
    globalMounts:
      - path: /usr/share/tessdata
  custom-files:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 1Gi
    globalMounts:
      - path: /customFiles
  pipeline:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 1Gi
    globalMounts:
      - path: /pipeline
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
