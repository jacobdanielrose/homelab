replicaCount: 1

image:
  tag: v2.14.0

# hostAliases:
# - ip: "10.107.160.137"
#   hostnames:
#     - "authentik.rostor.cloud"

env:
  TZ: "Europe/Zurich"
  AUTH_PROVIDERS: "oidc"
  AUTH_OIDC_ISSUER: "https://authentik.rostor.cloud/application/o/homarr/"
  AUTH_OIDC_CLIENT_NAME: "Authentik"
  # `groups` is required so Homarr can sync its groups from Authentik on login
  # (it removes memberships not present in the claim, so omitting it wipes them).
  AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
  AUTH_OIDC_GROUPS_ATTRIBUTE: "groups"
  AUTH_OIDC_AUTO_LOGIN: "false"
  AUTH_LOGOUT_REDIRECT_URL: "https://authentik.rostor.cloud/application/o/homarr/end-session/"

service:
  enabled: true
  type: ClusterIP

rbac:
  enabled: true

ingress:
  enabled: false

persistence:
  homarrDatabase:
    enabled: true
    storageClassName: longhorn
    size: 1Gi

envSecrets:
  dbEncryption:
    existingSecret: homarr-secrets
    key: db-encryption-key
  authOidcCredentials:
    existingSecret: homarr-secrets
    oidcClientId: oidc-client-id
    oidcClientSecret: oidc-client-secret
