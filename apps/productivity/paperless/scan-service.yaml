apiVersion: v1
kind: Service
metadata:
  name: scan-smb
  namespace: paperless
  annotations:
    metallb.universe.tf/address-pool: homelab-pool
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.3.29
  ports:
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
    - name: netbios
      port: 139
      targetPort: 139
      protocol: TCP
  selector:
    app.kubernetes.io/instance: paperless
    app.kubernetes.io/name: paperless-ngx