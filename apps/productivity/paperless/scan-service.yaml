apiVersion: v1
kind: Service
metadata:
  name: scan-gateway
  namespace: paperless
  annotations:
    metallb.universe.tf/address-pool: homelab-pool
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.3.25
  ports:
    - name: smb
      port: 445
      targetPort: smb
      protocol: TCP
    - name: netbios
      port: 139
      targetPort: smb-netbios
      protocol: TCP
  selector:
    app.kubernetes.io/name: scan-gateway