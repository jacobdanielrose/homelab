apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-media-paperless
spec:
  capacity:
    storage: 4500Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - hard
    - intr
  nfs:
    server: 192.168.3.164
    path: /volume1/k8s/paperless
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  volumeName: nfs-media-paperless
  resources:
    requests:
      storage: 4500Gi
