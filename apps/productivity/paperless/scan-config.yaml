apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-gateway
  namespace: paperless
data:
  # Per-user SMB share definitions for the Samba container.
  smb.conf: |
    [global]
      workgroup = WORKGROUP
      server string = Paperless Scan Gateway
      security = user
      map to guest = never
      passdb backend = smbpasswd
      create mask = 0664
      directory mask = 0775
      force group = scans
      follow symlinks = yes
      wide links = no
      load printers = no
      printing = bsd
      printcap name = /dev/null
      disable spoolss = yes
      guest account = nobody
      # Hide macOS metadata/junk files; the router also filters them.
      veto files = /.DS_Store/.Thumbs.db/.@__thumb/
      delete veto files = yes

    [jacob]
      comment = Scans for Jacob
      path = /consume/jacob
      browseable = yes
      read only = no
      writeable = yes
      valid users = jacob
      guest ok = no
      force group = scans
      create mask = 0664
      directory mask = 0775

    [federica]
      comment = Scans for Federica
      path = /consume/federica
      browseable = yes
      read only = no
      writeable = yes
      valid users = federica
      guest ok = no
      force group = scans
      create mask = 0664
      directory mask = 0775

  # Router sidecar entrypoint. Installs runtime deps, then on a new file in a
  # user's staging subfolder uploads it to Paperless with that user as owner,
  # then removes the local copy (staged-only consume).
  router.sh: |
    #!/bin/sh
    set -x
    # Install runtime deps, retrying until the network (registry) is reachable.
    until command -v inotifywait >/dev/null 2>&1 && command -v curl >/dev/null 2>&1; do
      apk add --no-cache curl inotify-tools >/dev/null 2>&1
      sleep 2
    done

    # Paperless runs as the main container in the same pod.
    PAPERLESS="http://127.0.0.1:8000"
    LOG=/tmp/router.log
    mkdir -p /consume/jacob /consume/federica
    echo "router started $(date -Is)" >> "$LOG"

    # Only process real document files (not macOS ._ sidecars or dotfiles).
    is_doc() {
      b="$(basename "$1")"
      case "$b" in
        ._*|.*) return 1 ;;
      esac
      case "$b" in
        *.pdf|*.PDF|*.png|*.PNG|*.jpg|*.jpeg|*.JPG|*.JPEG|*.tif|*.tiff|*.TIF|*.TIFF|\
        *.bmp|*.BMP|*.gif|*.GIF|*.webp|*.WEBP|*.heic|*.HEIC|*.doc|*.docx|*.odt|*.txt) return 0 ;;
        *) return 1 ;;
      esac
    }

    post_file() {
      folder="$1"
      file="$2"
      [ -f "$file" ] || return 0
      # Drop macOS AppleDouble sidecars (._*) and non-document files.
      if ! is_doc "$file"; then
        echo "$(date -Is) skipping non-document ${file##*/}" >> "$LOG"
        rm -f "$file"
        return 0
      fi
      case "$folder" in
        jacob)    TOKEN="$(tr -d '\n' < /secrets/paperless-token-jacob)"
                  OWNER="jacobdanielrose" ;;
        federica) TOKEN="$(tr -d '\n' < /secrets/paperless-token-federica)"
                  OWNER="federicatorrigino" ;;
        *)        echo "$(date -Is) unknown folder $folder, skipping" >> "$LOG"; return 0 ;;
      esac
      base="$(basename "$file")"
      echo "$(date -Is) posting to owner ${OWNER}: ${base}" >> "$LOG"
      code=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Authorization: Token ${TOKEN}" \
        -F "document=@${file}" \
        -F "owner=${OWNER}" \
        "${PAPERLESS}/api/documents/post_document/")
      if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
        rm -f "$file"
        echo "$(date -Is) ingested + removed ${base}" >> "$LOG"
      else
        echo "$(date -Is) FAILED (http ${code}) ${base}" >> "$LOG"
      fi
    }

    inotifywait -m -r -e close_write -e moved_to --format '%w%f' \
        /consume/jacob /consume/federica \
      | while read -r event_path; do
          folder="$(basename "$(dirname "$event_path")")"
          # Debounce: let the SMB write fully flush before reading.
          sleep 1
          post_file "$folder" "$event_path"
        done