apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-gateway
  namespace: paperless
data:
  # Per-user SMB share definitions for the Samba container.
  smb.conf: |
    [global]
      workgroup = WORKGROUP
      server string = Paperless Scan Gateway
      security = user
      map to guest = never
      passdb backend = smbpasswd
      create mask = 0664
      directory mask = 0775
      force group = users
      follow symlinks = yes
      wide links = no
      load printers = no
      printing = bsd
      printcap name = /dev/null
      disable spoolss = yes
      guest account = nobody
      # Hide macOS metadata/junk files; the router also filters them.
      veto files = /.DS_Store/.Thumbs.db/.@__thumb/
      delete veto files = yes

    [jacob]
      comment = Scans for Jacob
      path = /consume/jacob
      browseable = yes
      read only = no
      writeable = yes
      valid users = jacob
      guest ok = no
      force group = users
      create mask = 0664
      directory mask = 0775

    [federica]
      comment = Scans for Federica
      path = /consume/federica
      browseable = yes
      read only = no
      writeable = yes
      valid users = federica
      guest ok = no
      force group = users
      create mask = 0664
      directory mask = 0775

  # Router sidecar entrypoint. Installs runtime deps, then on a new file in a
  # user's staging subfolder uploads it to Paperless with that user as owner,
  # then removes the local copy (staged-only consume).
  router.sh: |
    #!/bin/sh
    # Polls the share directories for new documents and POSTs them to Paperless
    # via the API.  Uses polling (not inotify) so macOS SMB quirks (.sidecar
    # files, multiple close events) don't cause missed events.  Also cleans up
    # macOS ._ AppleDouble detritus.

    PAPERLESS="http://127.0.0.1:8000"
    LOG=/tmp/router.log
    POLL_INTERVAL=5
    mkdir -p /consume/jacob /consume/federica

    is_doc() {
      b="$(basename "$1")"
      case "$b" in ._*|.*) return 1 ;; esac
      case "$b" in
        *.pdf|*.PDF|*.png|*.PNG|*.jpg|*.jpeg|*.JPG|*.JPEG|\
        *.tif|*.tiff|*.TIF|*.TIFF|*.bmp|*.BMP|*.gif|*.GIF|\
        *.webp|*.WEBP|*.heic|*.HEIC|*.doc|*.docx|*.odt|*.txt) return 0 ;;
        *) return 1 ;;
      esac
    }

    post_file() {
      folder="$1"
      file="$2"
      [ -f "$file" ] || return 0
      # Drop macOS sidecars and non-docs on sight (may be re-created, keep trying).
      if ! is_doc "$file"; then
        echo "$(date -Is) skipping non-document ${file##*/}" >> "$LOG"
        rm -f "$file"; rm -f "/consume/${folder}/.$(basename \"$file\")"
        return 0
      fi
      case "$folder" in
        jacob)    TOKEN="$(tr -d '\n' < /secrets/paperless-token-jacob)"
                  OWNER="jacobdanielrose" ;;
        federica) TOKEN="$(tr -d '\n' < /secrets/paperless-token-federica)"
                  OWNER="federicatorrigino" ;;
        *)        echo "$(date -Is) unknown folder $folder, skipping" >> "$LOG"; return 0 ;;
      esac
      base="$(basename "$file")"
      echo "$(date -Is) posting to owner ${OWNER}: ${base}" >> "$LOG"
      code=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Authorization: Token ${TOKEN}" \
        -F "document=@${file}" \
        -F "owner=${OWNER}" \
        "${PAPERLESS}/api/documents/post_document/")
      if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
        rm -f "$file"; rm -f "/consume/${folder}/.$(basename \"$file\")"
        echo "$(date -Is) ingested + removed ${base}" >> "$LOG"
      else
        echo "$(date -Is) FAILED (http ${code}) ${base}" >> "$LOG"
      fi
    }

    echo "router started $(date -Is) (poll every ${POLL_INTERVAL}s)" >> "$LOG"
    while true; do
      for d in /consume/jacob /consume/federica; do
        folder="$(basename "$d")"
        for f in "$d"/*; do
          [ -f "$f" ] || continue
          post_file "$folder" "$f"
        done
      done
      sleep "${POLL_INTERVAL}"
    done