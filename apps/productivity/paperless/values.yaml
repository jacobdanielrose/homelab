image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: 3.3.4
  pullPolicy: IfNotPresent

env:
  TZ: Europe/Zurich
  PAPERLESS_URL: https://paperless.rostor.cloud
  PAPERLESS_TIME_ZONE: Europe/Zurich
  PAPERLESS_OCR_LANGUAGE: deu+eng+ita
  USERMAP_UID: "1026"
  USERMAP_GID: "100"
  PAPERLESS_SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: paperless-secret
        key: PAPERLESS_SECRET_KEY
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_DBHOST: paperless-postgres
  PAPERLESS_DBPORT: "5432"
  PAPERLESS_DBNAME: paperless
  PAPERLESS_DBUSER: paperless
  PAPERLESS_DBPASS:
    valueFrom:
      secretKeyRef:
        name: paperless-postgres-secret
        key: password
  PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: true
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "true"
  PAPERLESS_ACCOUNT_EMAIL_VERIFICATION: "none"
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_LOGOUT_REDIRECT_URL: https://authentik.rostor.cloud/application/o/paperless/end-session/
  PAPERLESS_SOCIALACCOUNT_PROVIDERS:
    valueFrom:
      secretKeyRef:
        name: paperless-oidc-secret
        key: PAPERLESS_SOCIALACCOUNT_PROVIDERS

  # Built-in AI classification (replaces paperless-ai)
  PAPERLESS_AI_ENABLED: "true"
  PAPERLESS_AI_LLM_BACKEND: ollama
  PAPERLESS_AI_LLM_ENDPOINT: http://ollama.ollama.svc:11434
  PAPERLESS_AI_LLM_MODEL: mistral-nemo:12b
  PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"

service:
  main:
    ports:
      http:
        port: 8000

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: paperless.rostor.cloud
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - paperless.rostor.cloud
        secretName: paperless-tls

persistence:
  data:
    enabled: true
    retain: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: longhorn
    mountPath: /usr/src/paperless/data
  media:
    enabled: true
    existingClaim: paperless-media
    mountPath: /usr/src/paperless/media
  export:
    enabled: true
    retain: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: longhorn
    mountPath: /usr/src/paperless/export
  consume:
    enabled: true
    retain: true
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: longhorn
    mountPath: /usr/src/paperless/consume

postgresql:
  enabled: false

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  auth:
    enabled: true
    username: ""
    existingSecret: paperless-redis-auth
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: longhorn
  replica:
    replicaCount: 0
