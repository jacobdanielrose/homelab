apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: komga
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://repo.helmforge.dev
      chart: komga
      targetRevision: 1.6.0
      helm:
        valueFiles:
          - $values/apps/media/komga/values.yaml
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/jacobdanielrose/homelab.git
      targetRevision: HEAD
      path: apps/media/komga
  destination:
    server: https://kubernetes.default.svc
    namespace: komga
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
    # The komga chart hardcodes the Deployment strategy (no values knob), so
    # Recreate is applied out-of-band:
    #   kubectl -n komga patch deploy komga-komga --type=merge \
    #     -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
    # Needed because komga-config-pvc is ReadWriteOnce: a rolling update puts the
    # new pod on a different node, it cannot attach the volume, and the rollout
    # hangs until ProgressDeadlineExceeded. Reapply after a namespace rebuild.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/strategy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
