# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: audiobooks-tls
#   namespace: audiobookshelf
# spec:
#   secretName: audiobooks-tls
#   dnsNames:
#     - audiobooks.rostor.lab
#   issuerRef:
#     name: rostor-internal
#     kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: audiobooks-cloud-tls
  namespace: audiobookshelf
spec:
  secretName: audiobooks-cloud-tls
  dnsNames:
    - audiobooks.rostor.cloud
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer